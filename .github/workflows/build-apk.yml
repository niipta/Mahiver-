name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure .env exists for Secrets Gradle Plugin
      run: |
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            printf 'GEMINI_API_KEY=""\nSUPABASE_URL=""\nSUPABASE_KEY=""\n' > .env
          fi
        fi

    - name: Decode or Generate Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        sed -i 's/kotlin.compiler.execution.strategy=in-process//g' gradle.properties

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon -Djava.awt.headless=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MahirVerse-debug
        path: app/build/outputs/apk/debug/app-debug.apk
